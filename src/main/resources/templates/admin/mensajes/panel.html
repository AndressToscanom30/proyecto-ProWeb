<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensajería | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body th:replace="~{fragments/layout :: shell('Mensajes', 'Bandeja de entrada y comunicación interna', 'mensajes', ~{::content})}">
    <section th:fragment="content" class="page-stack">

        <section class="page-hero">
            <div>
                <p class="eyebrow">Comunicación</p>
                <h2>Centro de Mensajes</h2>
                <p>Comunícate con otros usuarios del sistema de forma directa.</p>
            </div>
            <div class="hero-meta">
                <span class="pill tone-primary">No leídos <strong th:text="${noLeidos}">0</strong></span>
            </div>
        </section>

        <section class="grid-2">
            <!-- Formulario de envío -->
            <article class="panel-card">
                <div class="panel-header">
                    <div>
                        <p class="eyebrow">Nuevo</p>
                        <h3>Redactar mensaje</h3>
                    </div>
                </div>
                
                <form class="form-stack" id="form-mensaje" style="margin-top: 1rem;">
                    <div class="form-group">
                        <label for="destinatario">Destinatario</label>
                        <select id="destinatario" name="destinatarioUsername" class="form-control" required>
                            <option value="">Seleccione un usuario...</option>
                            <option th:each="u : ${usuarios}" th:value="${u.email}" th:text="${u.name + ' (' + u.email + ')'}"></option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="asunto">Asunto</label>
                        <input type="text" id="asunto" name="asunto" class="form-control" required />
                    </div>
                    
                    <div class="form-group">
                        <label for="contenido">Mensaje</label>
                        <textarea id="contenido" name="contenido" class="form-control" rows="4" required></textarea>
                    </div>
                    
                    <div class="form-actions" style="margin-top: 1rem;">
                        <button type="button" class="primary-action" onclick="enviarMensaje()">Enviar mensaje</button>
                    </div>
                    
                    <div id="mensaje-alert" style="display:none; margin-top: 1rem; padding: 1rem; border-radius: 4px;" class="tone-success">
                        Mensaje enviado con éxito.
                    </div>
                </form>
            </article>

            <!-- Bandeja de entrada -->
            <article class="panel-card table-panel">
                <div class="panel-header">
                    <div>
                        <p class="eyebrow">Bandeja</p>
                        <h3>Mensajes Recibidos</h3>
                    </div>
                </div>

                <div class="table-wrap" th:if="${not #lists.isEmpty(recibidos)}">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>De</th>
                                <th>Asunto</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="msg : ${recibidos}">
                                <td><strong th:text="${msg.emisorUsername}">Usuario</strong></td>
                                <td>
                                    <div th:text="${msg.asunto}">Asunto</div>
                                    <small th:text="${msg.contenido}" style="color: #6c757d;">Contenido</small>
                                </td>
                                <td th:text="${#temporals.format(msg.fechaEnvio, 'dd/MM HH:mm')}">Fecha</td>
                                <td>
                                    <span class="status-pill tone-warning" th:if="${!msg.leido}">NUEVO</span>
                                    <span class="status-pill tone-neutral" th:if="${msg.leido}">Leído</span>
                                    
                                    <button th:if="${!msg.leido}" class="secondary-action btn-sm" style="margin-left: 0.5rem;" th:onclick="|marcarLeido('${msg.id}')|">✓</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="empty-state compact" th:if="${#lists.isEmpty(recibidos)}">
                    <p>No tienes mensajes recibidos.</p>
                </div>
            </article>
        </section>

        <!-- Scripts para manejar el API REST desde la UI -->
        <script>
            function enviarMensaje() {
                const form = document.getElementById('form-mensaje');
                if(!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }
                
                const data = {
                    destinatarioUsername: document.getElementById('destinatario').value,
                    asunto: document.getElementById('asunto').value,
                    contenido: document.getElementById('contenido').value
                };
                
                fetch('/api/mensajes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // CSRF is disabled for API as per requirements
                    },
                    body: JSON.stringify(data)
                }).then(res => {
                    if(res.ok) {
                        const alert = document.getElementById('mensaje-alert');
                        alert.style.display = 'block';
                        form.reset();
                        setTimeout(() => window.location.reload(), 1500);
                    } else {
                        alert('Error al enviar el mensaje');
                    }
                });
            }
            
            function marcarLeido(id) {
                fetch(`/api/mensajes/${id}/leer`, {
                    method: 'PUT'
                }).then(res => {
                    if(res.ok) window.location.reload();
                });
            }
        </script>
    </section>
</body>
</html>
