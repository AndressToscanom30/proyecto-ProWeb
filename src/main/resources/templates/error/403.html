<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso denegado | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="error-page">
    <div class="error-card">
        <div class="error-code">403</div>
        <h1>Acceso denegado</h1>
        <p>No tienes permisos para acceder a esta sección. Si eres contribuyente, debes usar el Portal.</p>

        <div class="error-actions" style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a class="primary-action" th:href="@{/portal/inicio}">Ir a mi Portal</a>
            <a class="secondary-action" th:href="@{/dashboard}">Volver al panel admin</a>
            <a class="secondary-action" th:href="@{/login}">Ir al login</a>
        </div>
    </div>
</body>
</html>
