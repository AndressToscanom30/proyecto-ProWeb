<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Mis documentos | Portal Cronos</title>
</head>
<body th:replace="~{portal/layout :: layout('Mis documentos', ~{::content})}">
    <section th:fragment="content" class="page-stack">
        
        <section class="panel-card">
            <div class="panel-header">
                <div>
                    <p class="eyebrow">Documentos</p>
                    <h3>Todos mis documentos</h3>
                </div>
            </div>

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(documentos)}" class="empty-state">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                </div>
                <p>Aún no has subido documentos.</p>
            </div>

            <!-- Tabla de documentos -->
            <div class="table-wrap" th:if="${not #lists.isEmpty(documentos)}">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Tamaño</th>
                            <th>Fecha subida</th>
                            <th>Obligación vinculada</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="doc : ${documentos}">
                            <td th:text="${doc.fileName()}">Documento</td>
                            <td>
                                <span class="pill tone-neutral" th:text="${doc.fileTypeLabel()}">PDF</span>
                            </td>
                            <td th:text="${doc.fileSizeLabel()}">—</td>
                            <td th:text="${doc.uploadedAtLabel()}">—</td>
                            <td th:text="${doc.obligationLabel()}">Sin vincular</td>
                            <td>
                                <div class="action-group">
                                    <a th:href="@{/portal/documentos/{id}/descargar(id=${doc.id()})}"
                                       class="action-link">Descargar</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="panel-card">
            <div class="panel-header">
                <div>
                    <p class="eyebrow">Carga de archivos</p>
                    <h3>Subir documento</h3>
                </div>
            </div>
            <div th:replace="~{portal/upload-form :: upload-form(null)}"></div>
        </section>

    </section>
</body>
</html>
