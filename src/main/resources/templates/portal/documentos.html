<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Mis documentos | Portal Cronos</title>
</head>
<body th:replace="~{portal/layout :: layout('Mis documentos', ~{::main-content})}">
    <section th:fragment="main-content">

        <div class="eyebrow">Mis documentos</div>
        <h1>Documentos</h1>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(documentos)}" class="empty-state">
            <p>Aún no has subido documentos.</p>
        </div>

        <!-- Tabla de documentos -->
        <div th:unless="${#lists.isEmpty(documentos)}" class="table-wrapper">
            <table class="portal-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Tamaño</th>
                        <th>Fecha subida</th>
                        <th>Obligación vinculada</th>
                        <th>Descarga</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="doc : ${documentos}">
                        <td th:text="${doc.fileName()}">Documento</td>
                        <td>
                            <span class="status-badge"
                                  th:text="${doc.fileTypeLabel()}">PDF</span>
                        </td>
                        <td th:text="${doc.fileSizeLabel()}">—</td>
                        <td th:text="${doc.uploadedAtLabel()}">—</td>
                        <td th:text="${doc.obligationLabel()}">Sin vincular</td>
                        <td>
                            <a th:href="@{/portal/documentos/{id}/descargar(id=${doc.id()})}"
                               class="portal-link">Descargar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Sección de subida de documentos -->
        <div style="margin-top:2rem;">
            <h2 style="font-size:1.2rem;">Subir documento</h2>
            <div th:replace="~{portal/upload-form :: upload-form(null)}"></div>
        </div>

    </section>
</body>
</html>
