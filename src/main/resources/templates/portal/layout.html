<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title} + ' | Portal Cronos'">Portal Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body th:fragment="layout(title, content)" class="app-page">
    <script>
        (function () {
            var theme = 'light';
            try {
                var storedTheme = localStorage.getItem('cronos-theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                theme = storedTheme || (prefersDark ? 'dark' : 'light');
            } catch (error) {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <div class="app-frame">
        <aside class="app-sidebar">
            <div class="sidebar-header-mobile">
                <div class="sidebar-brand">
                    <div class="brand-mark">C</div>
                    <div class="brand-copy">
                        <strong class="eyebrow">Cronos</strong>
                        <span>Portal Contribuyente</span>
                    </div>
                </div>
                <button class="sidebar-close-btn" type="button" data-sidebar-close aria-label="Cerrar menú">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="sidebar-toolbar">
                <span class="eyebrow">Navegación</span>
                <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-label="Colapsar barra lateral">
                    <svg viewBox="0 0 24 24"><path d="M14 5l-7 7 7 7" /></svg>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a th:href="@{/portal/inicio}" class="sidebar-link" th:classappend="${title == 'Mi perfil'} ? 'is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <span>Mi perfil</span>
                </a>
                <a th:href="@{/portal/obligaciones}" class="sidebar-link" th:classappend="${title == 'Mis obligaciones'} ? 'is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                    <span>Mis obligaciones</span>
                </a>
                <a th:href="@{/portal/documentos}" class="sidebar-link" th:classappend="${title == 'Mis documentos'} ? 'is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <path d="M7 4.5h6l4.5 4.5V19a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V6A1.5 1.5 0 0 1 7 4.5z" />
                        <path d="M13 4.5V9h4.5" />
                    </svg>
                    <span>Mis documentos</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <p>Contribuyente</p>
                <p sec:authentication="name">correo@ejemplo.com</p>
            </div>
        </aside>

        <div class="mobile-sidebar-overlay" data-sidebar-overlay></div>
        <div class="app-main">
            <header class="app-topbar">
                <button class="mobile-menu-btn" type="button" data-mobile-menu aria-label="Abrir menú">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M4 7h16M4 12h16M4 17h16" />
                    </svg>
                </button>
                <div class="topbar-copy">
                    <h1 th:text="${title}">Portal</h1>
                </div>

                <div class="topbar-actions">
                    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Cambiar a tema oscuro">
                        <svg class="theme-toggle-icon theme-toggle-icon-dark" viewBox="0 0 24 24">
                            <path d="M21 12.8A8.8 8.8 0 1 1 11.2 3 7.2 7.2 0 0 0 21 12.8z" />
                        </svg>
                        <svg class="theme-toggle-icon theme-toggle-icon-light" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4.5" />
                            <path d="M12 3.5v2.2M12 18.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" />
                        </svg>
                        <span class="theme-toggle-label" data-theme-label>Oscuro</span>
                    </button>

                    <div class="user-chip-wrapper">
                        <button class="user-chip" type="button" data-user-menu aria-label="Menú de usuario" aria-expanded="false">
                            <div class="user-avatar">C</div>
                            <svg class="user-chip-caret" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 9l6 6 6-6" />
                            </svg>
                        </button>
                        <div class="user-dropdown">
                            <div class="user-dropdown-info">
                                <span sec:authentication="name">correo@ejemplo.com</span>
                            </div>
                            <hr class="user-dropdown-divider" />
                            <form th:action="@{/logout}" method="post" style="margin:0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="user-dropdown-item user-dropdown-logout" type="submit">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                        <polyline points="16 17 21 12 16 7" />
                                        <line x1="21" y1="12" x2="9" y2="12" />
                                    </svg>
                                    Cerrar sesión
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </header>

            <main class="app-content">
                <div th:replace="${content}"></div>
            </main>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
