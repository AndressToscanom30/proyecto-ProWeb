<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragmento reutilizable de subida de documentos.
  Uso:
    <div th:replace="~{portal/upload-form :: upload-form(${obligacion.id()})}"></div>
    <div th:replace="~{portal/upload-form :: upload-form(null)}"></div>

  obligationId:
    - String → se envía como parámetro al POST (asocia el documento a la obligación)
    - null   → subida libre, sin obligación asociada
-->
<div th:fragment="upload-form(obligationId)">

    <!-- Mensajes de feedback -->
    <div id="upload-success" class="alert-line alert-success" style="display:none; margin-bottom: 1rem;">
        Documento subido correctamente.
    </div>
    <div id="upload-error" class="alert-line alert-error" style="display:none; margin-bottom: 1rem;"></div>

    <!-- Campos -->
    <div class="form-grid">

        <label class="field-group">
            <span class="field-label">Archivo</span>
            <input type="file" id="upload-file"
                   accept=".pdf,.jpg,.jpeg,.png,.xlsx"
                   class="text-input" />
            <small class="field-hint">PDF, JPG, PNG o XLSX · máx. 10 MB</small>
        </label>

        <label class="field-group">
            <span class="field-label">Descripción (opcional)</span>
            <input type="text" id="upload-desc"
                   maxlength="500"
                   placeholder="Ej: Declaración de renta 2025"
                   class="text-input" />
        </label>

        <div class="form-actions">
            <button type="button" id="upload-btn"
                    class="primary-action"
                    th:attr="data-obligation-id=${obligationId}">
                Subir documento
            </button>

            <span id="upload-spinner" class="pill tone-info" style="display:none;">
                Subiendo...
            </span>
        </div>

    </div>

    <script th:inline="javascript">
    (function () {
        const btn       = document.getElementById('upload-btn');
        const fileInput = document.getElementById('upload-file');
        const descInput = document.getElementById('upload-desc');
        const spinner   = document.getElementById('upload-spinner');
        const msgOk     = document.getElementById('upload-success');
        const msgErr    = document.getElementById('upload-error');

        // obligationId puede ser null cuando el fragmento se usa fuera del detalle.
        const obligationId = btn.dataset.obligationId && btn.dataset.obligationId !== 'null'
            ? btn.dataset.obligationId : null;

        // Token CSRF leído de cookie XSRF-TOKEN si existe
        const csrfToken = document.cookie
            .split('; ')
            .find(r => r.startsWith('XSRF-TOKEN='))
            ?.split('=')[1];

        function mostrarError(texto) {
            msgErr.textContent   = texto;
            msgErr.style.display = 'flex';
        }

        btn.addEventListener('click', async () => {
            msgOk.style.display  = 'none';
            msgErr.style.display = 'none';

            const file = fileInput.files[0];
            if (!file) {
                mostrarError('Selecciona un archivo antes de subir.');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            if (descInput.value.trim()) {
                formData.append('description', descInput.value.trim());
            }
            if (obligationId) {
                formData.append('obligationId', obligationId);
            }

            btn.disabled          = true;
            spinner.style.display = 'inline-flex';

            try {
                const headers = { 'X-Requested-With': 'XMLHttpRequest' };
                if (csrfToken) {
                    headers['X-XSRF-TOKEN'] = csrfToken;
                }

                const resp = await fetch('/api/contribuyente/me/documentos', {
                    method: 'POST',
                    headers,
                    body: formData
                });

                if (resp.status === 201) {
                    msgOk.style.display = 'flex';
                    fileInput.value     = '';
                    descInput.value     = '';
                    // Recarga para actualizar la tabla de documentos.
                    setTimeout(() => location.reload(), 1500);
                } else {
                    const body = await resp.text();
                    let msg = 'Error al subir el documento.';
                    try {
                        const json = JSON.parse(body);
                        msg = json.message || json.detail || msg;
                    } catch (_) { msg = body || msg; }
                    mostrarError(msg);
                }
            } catch (e) {
                mostrarError('Error de conexión. Intenta de nuevo.');
            } finally {
                btn.disabled          = false;
                spinner.style.display = 'none';
            }
        });
    })();
    </script>

</div>

</body>
</html>
