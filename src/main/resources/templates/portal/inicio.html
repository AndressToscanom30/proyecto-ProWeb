<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Mi perfil | Portal Cronos</title>
</head>
<body th:replace="~{portal/layout :: layout('Mi perfil', ~{::main-content})}">
    <section th:fragment="main-content">

        <div class="eyebrow">Mi perfil</div>
        <h1 th:text="${contribuyente.businessName}">Razón social</h1>

        <div class="card-grid">

            <!-- Identificación -->
            <div class="info-card">
                <div class="info-card__label">Identificación (NIT / CC)</div>
                <div class="info-card__value"
                     th:text="${contribuyente.identificacion} ?: '—'">—</div>
            </div>

            <!-- Tipo de contribuyente -->
            <div class="info-card">
                <div class="info-card__label">Tipo de contribuyente</div>
                <div class="info-card__value"
                     th:text="${contribuyente.type != null
                                 ? #strings.replace(contribuyente.type.name(), '_', ' ')
                                 : '—'}">—</div>
            </div>

            <!-- Contacto -->
            <div class="info-card">
                <div class="info-card__label">Correo electrónico</div>
                <div class="info-card__value"
                     th:text="${contribuyente.email} ?: '—'">—</div>
            </div>

            <div class="info-card">
                <div class="info-card__label">Teléfono</div>
                <div class="info-card__value"
                     th:text="${contribuyente.phone} ?: '—'">—</div>
            </div>

            <!-- Dirección -->
            <div class="info-card info-card--full">
                <div class="info-card__label">Dirección</div>
                <div class="info-card__value"
                     th:text="${contribuyente.address} ?: '—'">—</div>
            </div>

            <!-- Gran contribuyente -->
            <div class="info-card">
                <div class="info-card__label">Gran contribuyente</div>
                <div class="info-card__value"
                     th:text="${contribuyente.granContribuyente ? 'Sí' : 'No'}">—</div>
            </div>

            <!-- Estado -->
            <div class="info-card">
                <div class="info-card__label">Estado</div>
                <div class="info-card__value">
                    <span class="status-badge"
                          th:classappend="${contribuyente.active ? 'status-badge--active' : 'status-badge--inactive'}"
                          th:text="${contribuyente.active ? 'Activo' : 'Inactivo'}">—</span>
                </div>
            </div>

            <!-- Fecha de registro -->
            <div class="info-card">
                <div class="info-card__label">Fecha de registro</div>
                <div class="info-card__value"
                     th:text="${contribuyente.registrationDate != null
                                 ? #temporals.format(contribuyente.registrationDate, 'dd/MM/yyyy')
                                 : '—'}">—</div>
            </div>

        </div><!-- /card-grid -->

    </section>
</body>
</html>
