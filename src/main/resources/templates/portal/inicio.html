<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Mi perfil | Portal Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body th:replace="~{portal/layout :: layout('Mi perfil', ~{::content})}">
    <section th:fragment="content" class="page-stack">
        <section class="panel-card">
            <div class="panel-header">
                <div>
                    <p class="eyebrow">Mi perfil</p>
                    <h3 th:text="${contribuyente.businessName}">Razón social</h3>
                </div>
            </div>

            <div class="metric-grid">
                <!-- Identificación -->
                <div class="metric-card">
                    <h4 class="card-label">Identificación (NIT / CC)</h4>
                    <p class="card-value" style="word-wrap: break-word; overflow-wrap: break-word; word-break: break-all;" th:text="${contribuyente.identificacion} ?: '—'">—</p>
                </div>

                <!-- Tipo de contribuyente -->
                <div class="metric-card">
                    <h4 class="card-label">Tipo de contribuyente</h4>
                    <p class="card-value" style="word-wrap: break-word; overflow-wrap: break-word; word-break: break-all;"
                         th:text="${contribuyente.type != null
                                     ? (contribuyente.type.name() == 'LEGAL_ENTITY' ? 'Persona Jurídica' : 'Persona Natural')
                                     : '—'}">—</p>
                </div>

                <!-- Contacto -->
                <div class="metric-card">
                    <h4 class="card-label">Correo electrónico</h4>
                    <p class="card-value" style="word-wrap: break-word; overflow-wrap: break-word; word-break: break-all;" th:text="${contribuyente.email} ?: '—'">—</p>
                </div>

                <div class="metric-card">
                    <h4 class="card-label">Teléfono</h4>
                    <p class="card-value" style="word-wrap: break-word; overflow-wrap: break-word; word-break: break-all;" th:text="${contribuyente.phone} ?: '—'">—</p>
                </div>

                <!-- Estado -->
                <div class="metric-card">
                    <h4 class="card-label">Estado</h4>
                    <div style="margin-top:0.5rem;">
                        <span th:if="${contribuyente.active}" class="pill tone-success">Activo</span>
                        <span th:if="${!contribuyente.active}" class="pill tone-danger">Inactivo</span>
                    </div>
                </div>

                <!-- Fecha de registro -->
                <div class="metric-card">
                    <h4 class="card-label">Fecha de registro</h4>
                    <p class="card-value"
                         th:text="${contribuyente.registrationDate != null
                                     ? #temporals.format(contribuyente.registrationDate, 'dd/MM/yyyy')
                                     : '—'}">—</p>
                </div>
                
                <!-- Dirección -->
                <div class="metric-card" style="grid-column: 1 / -1;">
                    <h4 class="card-label">Dirección</h4>
                    <p class="card-value" style="word-wrap: break-word; overflow-wrap: break-word; word-break: break-all;" th:text="${contribuyente.address} ?: '—'">—</p>
                </div>
            </div>
        </section>
    </section>
</body>
</html>
