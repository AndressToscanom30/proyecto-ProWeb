<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body th:fragment="shell(pageTitle, pageSubtitle, activeSection, content)" class="app-page">
    <script>
        (function () {
            var theme = 'light';

            try {
                var storedTheme = localStorage.getItem('cronos-theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                theme = storedTheme || (prefersDark ? 'dark' : 'light');
            } catch (error) {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <div class="app-frame">
        <aside class="app-sidebar">
            <div class="sidebar-header-mobile">
                <div class="sidebar-brand">
                    <div class="brand-mark">C</div>
                    <div class="brand-copy">
                        <strong class="eyebrow">Cronos</strong>
                        <span>Panel fiscal</span>
                    </div>
                </div>
                <button class="sidebar-close-btn" type="button" data-sidebar-close aria-label="Cerrar menú">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="sidebar-toolbar">
                <span class="eyebrow">Navegación</span>
                <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-label="Colapsar barra lateral">
                    <svg viewBox="0 0 24 24">
                        <path d="M14 5l-7 7 7 7" />
                    </svg>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a th:href="@{/dashboard}" class="sidebar-link"
                    th:classappend="${activeSection} == 'dashboard' ? ' is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M4 10.5V6.8a2 2 0 0 1 2-2h3.2a2 2 0 0 1 2 2v3.7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM13 17.2v-3.7a2 2 0 0 1 2-2h3.2a2 2 0 0 1 2 2v3.7a2 2 0 0 1-2 2H15a2 2 0 0 1-2-2zM13 7.7V6.8a2 2 0 0 1 2-2h3.2a2 2 0 0 1 2 2v.9a2 2 0 0 1-2 2H15a2 2 0 0 1-2-2zM4 17.2v-.9a2 2 0 0 1 2-2h3.2a2 2 0 0 1 2 2v.9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" />
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a sec:authorize="hasAnyRole('GERENTE', 'ASESOR', 'CONTADOR', 'AUXILIAR_CONTADOR')" th:href="@{/notificaciones}" class="sidebar-link"
                    th:classappend="${activeSection} == 'notificaciones' ? ' is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <path d="M15 17.5H9" />
                        <path
                            d="M17 17.5H7a2 2 0 0 0 1.7-2l.3-4.2A3.9 3.9 0 0 1 13 7.8v-.8a1 1 0 1 1 2 0v.8a3.9 3.9 0 0 1 4 3.5l.3 4.2a2 2 0 0 0 1.7 2z" />
                    </svg>
                    <span>Notificaciones</span>
                </a>
                <a th:href="@{/calendario-fiscal}" class="sidebar-link"
                    th:classappend="${activeSection} == 'calendario' ? ' is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <rect x="3.5" y="5" width="17" height="15.5" rx="3" />
                        <path d="M8 3.5v4M16 3.5v4M3.5 10.5h17" />
                    </svg>
                    <span>Calendario Fiscal</span>
                </a>
                <a th:href="@{/tareas}" class="sidebar-link"
                    th:classappend="${activeSection} == 'tareas' ? ' is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 7h8M5 12h14M5 17h10" />
                        <path d="M17 7l1.5 1.5L21 6" />
                    </svg>
                    <span>Tareas</span>
                </a>
                <a th:href="@{/clientes}" class="sidebar-link"
                    th:classappend="${activeSection} == 'clientes' ? ' is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.5 20v-1.5a4.5 4.5 0 0 0-4.5-4.5H7a4.5 4.5 0 0 0-4.5 4.5V20" />
                        <circle cx="9" cy="7" r="3.5" />
                        <path d="M19.5 20v-1.2a3.8 3.8 0 0 0-2.4-3.5" />
                    </svg>
                    <span>Clientes</span>
                </a>
                <a sec:authorize="hasAnyRole('GERENTE', 'ASESOR', 'ADMIN')" th:href="@{/obligaciones}" class="sidebar-link"
                    th:classappend="${activeSection} == 'obligaciones' ? ' is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M7 4.5h10A2.5 2.5 0 0 1 19.5 7v10A2.5 2.5 0 0 1 17 19.5H7A2.5 2.5 0 0 1 4.5 17V7A2.5 2.5 0 0 1 7 4.5z" />
                        <path d="M8 8h8M8 12h8M8 16h5" />
                    </svg>
                    <span>Obligaciones</span>
                </a>
                <a sec:authorize="hasAnyRole('CONTADOR', 'AUXILIAR_CONTADOR')" th:href="@{/mis-obligaciones}" class="sidebar-link"
                    th:classappend="${activeSection} == 'mis-obligaciones' ? ' is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M7 4.5h10A2.5 2.5 0 0 1 19.5 7v10A2.5 2.5 0 0 1 17 19.5H7A2.5 2.5 0 0 1 4.5 17V7A2.5 2.5 0 0 1 7 4.5z" />
                        <path d="M8 8h8M8 12h8M8 16h5" />
                    </svg>
                    <span>Mis Obligaciones</span>
                </a>
                <a th:href="@{/dashboard#documentos}" class="sidebar-link">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M7 4.5h6l4.5 4.5V19a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V6A1.5 1.5 0 0 1 7 4.5z" />
                        <path d="M13 4.5V9h4.5" />
                    </svg>
                    <span>Documentos</span>
                </a>
                <a th:href="@{/reportes}" class="sidebar-link"
                    th:classappend="${activeSection} == 'reportes' ? ' is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 19.5h14" />
                        <path d="M7 15V9" />
                        <path d="M12 15V6.5" />
                        <path d="M17 15v-4.5" />
                    </svg>
                    <span>Reportes</span>
                </a>
                <a sec:authorize="hasAnyRole('GERENTE', 'ADMIN', 'ASESOR')" th:href="@{/empleados}" class="sidebar-link"
                    th:classappend="${activeSection} == 'equipo' ? ' is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <path d="M4.5 19.5v-1.2a4.3 4.3 0 0 1 4.3-4.3h6.4a4.3 4.3 0 0 1 4.3 4.3v1.2" />
                        <circle cx="12" cy="8" r="3.5" />
                    </svg>
                    <span>Equipo</span>
                </a>
                <a sec:authorize="hasAnyRole('GERENTE', 'ADMIN', 'ASESOR')" th:href="@{/configuracion}" class="sidebar-link"
                    th:classappend="${activeSection} == 'configuracion' ? ' is-active' : ''">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M9.4 4.8h5.2l.7 2.3 2.2 1.3-.6 2.4.6 2.4-2.2 1.3-.7 2.3H9.4l-.7-2.3-2.2-1.3.6-2.4-.6-2.4 2.2-1.3z" />
                        <circle cx="12" cy="12" r="2.3" />
                    </svg>
                    <span>Configuración</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <p th:text="${usuario.role != null ? usuario.role.description : 'Usuario'}">Usuario</p>
                <p th:text="${usuario.email}">correo@ejemplo.com</p>
            </div>
        </aside>

        <div class="mobile-sidebar-overlay" data-sidebar-overlay></div>
        <div class="app-main">
            <header class="app-topbar">
                <button class="mobile-menu-btn" type="button" data-mobile-menu aria-label="Abrir menú">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <path d="M4 7h16M4 12h16M4 17h16" />
                    </svg>
                </button>
                <div class="topbar-copy">
                    <h1 th:text="${pageTitle}">Dashboard</h1>
                </div>

                <div class="topbar-actions">
                    <label class="search-field" for="tableSearch">
                        <svg viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="6.5" />
                            <path d="M16 16l4 4" />
                        </svg>
                        <input id="tableSearch" type="search" placeholder="Buscar cliente, tarea o obligación" />
                    </label>

                    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false"
                        aria-label="Cambiar a tema oscuro">
                        <svg class="theme-toggle-icon theme-toggle-icon-dark" viewBox="0 0 24 24">
                            <path d="M21 12.8A8.8 8.8 0 1 1 11.2 3 7.2 7.2 0 0 0 21 12.8z" />
                        </svg>
                        <svg class="theme-toggle-icon theme-toggle-icon-light" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4.5" />
                            <path
                                d="M12 3.5v2.2M12 18.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" />
                        </svg>
                        <span class="theme-toggle-label" data-theme-label>Oscuro</span>
                    </button>

                    <div class="user-chip-wrapper">
                        <button class="user-chip" type="button" data-user-menu aria-label="Menú de usuario"
                            aria-expanded="false">
                            <div class="user-avatar"
                                th:text="${usuario.name != null and !#strings.isEmpty(usuario.name) ? usuario.name.substring(0, 1) : 'U'}">
                                U</div>
                            <svg class="user-chip-caret" viewBox="0 0 24 24" width="16" height="16" fill="none"
                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 9l6 6 6-6" />
                            </svg>
                        </button>
                        <div class="user-dropdown">
                            <div class="user-dropdown-info">
                                <span th:text="${usuario.email}">correo@ejemplo.com</span>
                            </div>
                            <hr class="user-dropdown-divider" />
                            <a sec:authorize="hasAnyRole('GERENTE', 'ADMIN', 'ASESOR')" th:href="@{/configuracion}" class="user-dropdown-item">
                                <svg viewBox="0 0 24 24">
                                    <path
                                        d="M9.4 4.8h5.2l.7 2.3 2.2 1.3-.6 2.4.6 2.4-2.2 1.3-.7 2.3H9.4l-.7-2.3-2.2-1.3.6-2.4-.6-2.4 2.2-1.3z" />
                                    <circle cx="12" cy="12" r="2.3" />
                                </svg>
                                Configuración
                            </a>
                            <a sec:authorize="hasAnyRole('GERENTE', 'ASESOR', 'CONTADOR', 'AUXILIAR_CONTADOR')" class="user-dropdown-item" th:href="@{/notificaciones}" aria-label="Notificaciones internas">
                                <svg viewBox="0 0 24 24">
                                    <path d="M15 17.5H9" />
                                    <path
                                        d="M17 17.5H7a2 2 0 0 0 1.7-2l.3-4.2A3.9 3.9 0 0 1 13 7.8v-.8a1 1 0 1 1 2 0v.8a3.9 3.9 0 0 1 4 3.5l.3 4.2a2 2 0 0 0 1.7 2z" />
                                </svg>
                                Notificaciones internas
                            </a>
                            <form th:action="@{/logout}" method="post" style="margin:0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="user-dropdown-item user-dropdown-logout" type="submit">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                        <polyline points="16 17 21 12 16 7" />
                                        <line x1="21" y1="12" x2="9" y2="12" />
                                    </svg>
                                    Cerrar sesión
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </header>

            <main class="app-content">
                <div th:replace="${content}"></div>
            </main>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>

</html>
