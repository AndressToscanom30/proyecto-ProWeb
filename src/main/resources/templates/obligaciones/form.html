<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva obligación | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body th:replace="~{fragments/layout :: shell('Nueva obligación', 'Registro de vencimientos y períodos fiscales por cliente', 'obligaciones', ~{::content})}">
    <section th:fragment="content" class="page-stack">
        <section class="panel-card">
            <div class="panel-header">
                <div>
                    <p class="eyebrow">Obligaciones</p>
                    <h3 th:text="${editId != null ? 'Editar obligación' : (contribuyente != null ? 'Nueva obligación para ' + contribuyente.businessName : 'Nueva obligación')}">Nueva obligación</h3>
                </div>
                <a th:href="${contribuyente != null ? '/obligaciones?taxPayerId=' + contribuyente.id : '/obligaciones'}" class="secondary-action">&larr; Volver</a>
            </div>

            <div class="alert-line alert-error" th:if="${error != null}" th:text="${error}">Error</div>

            <form class="form-grid" th:action="${editId != null} ? @{/obligaciones/actualizar/{id}(id=${editId})} : @{/obligaciones/guardar}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <th:block th:if="${contribuyente != null}">
                    <input type="hidden" name="taxPayerId" th:value="${contribuyente.id}" />
                </th:block>

                <label class="field-group" th:unless="${contribuyente != null}">
                    <span class="field-label">Contribuyente</span>
                    <select class="text-input" name="taxPayerId" required>
                        <option value="">Seleccionar contribuyente...</option>
                        <option th:each="c : ${contribuyentes}" th:value="${c.id}" th:text="${c.businessName + ' (' + c.identificacion + ')'}"></option>
                    </select>
                </label>

                <label class="field-group">
                    <span class="field-label">Tipo de obligación</span>
                    <select class="text-input" name="type" id="type-select" required onchange="updateFiscalPeriods()">
                        <option value="">Seleccionar...</option>
                        <option th:each="t : ${tipos}" th:value="${t.name()}" th:text="${t.description}" th:selected="${dto != null && dto.type() == t}"></option>
                    </select>
                </label>

                <label class="field-group" th:if="${editId == null}">
                    <span class="field-label">Contador responsable</span>
                    <select class="text-input" name="counterResponsibleId" required>
                        <option value="">Seleccionar contador...</option>
                        <option th:each="contador : ${contadores}"
                                th:value="${contador.id}"
                                th:text="${contador.name + ' (' + contador.email + ')'}"></option>
                    </select>
                    <small class="field-hint">Solo usuarios con rol CONTADOR.</small>
                </label>

                <div class="field-group" th:if="${editId != null}">
                    <span class="field-label">Contador responsable</span>
                    <div class="panel-card" style="padding: 1rem; margin: 0; border: 1px dashed var(--border); background: var(--surface-soft);">
                        <strong th:text="${dto != null && dto.counterResponsibleId() != null ? dto.counterResponsibleId() : 'Se mantiene el contador asignado desde el detalle'}">Contador</strong>
                        <p style="margin: 0.35rem 0 0; color: var(--text-muted); font-size: 0.9rem;">La reasignación de contador se gestiona desde el detalle de la obligación.</p>
                    </div>
                </div>

                <label class="field-group">
                    <span class="field-label">Período fiscal</span>
                    <select class="text-input" name="fiscalPeriod" id="fiscal-period-select" required disabled>
                        <option value="">Seleccione primero un tipo de obligación...</option>
                    </select>
                    <!-- Guardar valor original si estamos en modo de edición -->
                    <input type="hidden" id="initialFiscalPeriod" th:value="${dto != null ? dto.fiscalPeriod() : ''}" />
                </label>

                <label class="field-group">
                    <span class="field-label">Año gravable</span>
                    <input class="text-input" type="number" name="taxYear" th:value="${dto != null ? dto.taxYear() : 2026}" min="2020" max="2035" required onchange="updateFiscalPeriods()" oninput="updateFiscalPeriods()" />
                </label>

                <label class="field-group">
                    <span class="field-label">Fecha de vencimiento (opcional)</span>
                    <input class="text-input" type="date" name="dueDateOverride"
                           th:value="${currentDueDate != null ? currentDueDate : (dto != null && dto.dueDateOverride() != null ? dto.dueDateOverride() : '')}"
                           th:attr="data-edit-mode=${editId != null}, data-original-due-date=${currentDueDate != null ? currentDueDate : ''}" />
                    <small class="field-hint">Dejar vacío para calcular automáticamente según el calendario tributario</small>
                </label>

                <label class="field-group override-reason" th:if="${editId != null}" style="display:none">
                    <span class="field-label">Motivo / Notas del cambio de fecha</span>
                    <input class="text-input" type="text" name="dueDateOverrideReason" id="dueDateOverrideReason" placeholder="Requerido si cambias la fecha" th:value="${dto != null ? dto.dueDateOverrideReason() : ''}"/>
                </label>

                <label class="field-group">
                    <span class="field-label">Notas (opcional)</span>
                    <textarea class="text-input textarea" name="notes" placeholder="Notas adicionales"
                              th:text="${dto != null ? dto.notes() : ''}"></textarea>
                </label>

                <div class="form-actions">
                    <button class="primary-action" type="submit">Guardar obligación</button>
                    <a th:href="${contribuyente != null ? '/obligaciones?taxPayerId=' + contribuyente.id : '/obligaciones'}" class="secondary-action">Cancelar</a>
                </div>
            </form>

            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const overrideInput = document.querySelector('input[name="dueDateOverride"]');
                    const overrideReason = document.querySelector('.override-reason');
                    const reasonInput = document.getElementById('dueDateOverrideReason');
                    const isEditMode = overrideInput && overrideInput.dataset.editMode === 'true';
                    const originalDueDate = overrideInput ? (overrideInput.dataset.originalDueDate || '') : '';

                    function toggleReason() {
                        if (!isEditMode || !overrideReason || !reasonInput) {
                            return;
                        }

                        const currentDueDate = overrideInput.value || '';
                        const hasChanged = currentDueDate !== '' && currentDueDate !== originalDueDate;

                        if (hasChanged) {
                            overrideReason.style.display = 'block';
                            reasonInput.setAttribute('required', 'required');
                        } else {
                            overrideReason.style.display = 'none';
                            reasonInput.removeAttribute('required');
                        }
                    }

                    if (overrideInput) {
                        overrideInput.addEventListener('change', toggleReason);
                        overrideInput.addEventListener('input', toggleReason);
                        toggleReason();
                    }

                    // ... resto del JS de form.html
                });
            </script>
            
            <!-- Script independiente y global para asegurar la ejecución -->
            <script>
                function updateFiscalPeriods() {
                    try {
                        const typeSelect = document.getElementById('type-select');
                        const periodSelect = document.getElementById('fiscal-period-select');
                        const initialPeriodEl = document.getElementById('initialFiscalPeriod');
                        const initialPeriod = initialPeriodEl ? initialPeriodEl.value : '';
                        const yearInput = document.querySelector('input[name="taxYear"]');

                        if (!typeSelect || !periodSelect) return;
                        
                        const type = typeSelect.value;
                        const year = yearInput && yearInput.value ? yearInput.value : (new Date().getFullYear() + 2);
                        
                        periodSelect.innerHTML = '';
                        
                        if (!type || type === '') {
                            const defaultOpt = document.createElement('option');
                            defaultOpt.value = "";
                            defaultOpt.textContent = "Seleccione primero un tipo de obligación...";
                            periodSelect.appendChild(defaultOpt);
                            periodSelect.disabled = true;
                            return;
                        }
                        
                        periodSelect.disabled = false;
                        let options = [];

                        const anualOptions = [{ value: `${year}`, text: `Anual` }];
                        const bimestralOptions = [
                            { value: `${year}-B1`, text: `Bimestre 1 (Enero – Febrero)` },
                            { value: `${year}-B2`, text: `Bimestre 2 (Marzo – Abril)` },
                            { value: `${year}-B3`, text: `Bimestre 3 (Mayo – Junio)` },
                            { value: `${year}-B4`, text: `Bimestre 4 (Julio – Agosto)` },
                            { value: `${year}-B5`, text: `Bimestre 5 (Septiembre – Octubre)` },
                            { value: `${year}-B6`, text: `Bimestre 6 (Noviembre – Diciembre)` }
                        ];
                        const cuatrimestralOptions = [
                            { value: `${year}-Q1`, text: `Cuatrimestre 1 (Enero – Abril)` },
                            { value: `${year}-Q2`, text: `Cuatrimestre 2 (Mayo – Agosto)` },
                            { value: `${year}-Q3`, text: `Cuatrimestre 3 (Septiembre – Diciembre)` }
                        ];
                        const trimestralOptions = [
                            { value: `${year}-T1`, text: `Trimestre 1 (Enero – Marzo)` },
                            { value: `${year}-T2`, text: `Trimestre 2 (Abril – Junio)` },
                            { value: `${year}-T3`, text: `Trimestre 3 (Julio – Septiembre)` },
                            { value: `${year}-T4`, text: `Trimestre 4 (Octubre – Diciembre)` }
                        ];
                        const semestralOptions = [
                            { value: `${year}-S1`, text: `Semestre 1 (Enero – Junio)` },
                            { value: `${year}-S2`, text: `Semestre 2 (Julio – Diciembre)` }
                        ];
                        const mensualNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                        const mensualOptions = mensualNames.map((name, i) => {
                            const monthStr = (i + 1).toString().padStart(2, '0');
                            return { value: `${year}-${monthStr}`, text: name };
                        });

                        if (type === 'WITHHOLDING') {
                            options = [{ value: '', text: 'Seleccione un mes...' }, ...mensualOptions];
                        } else if (type === 'VAT') {
                            options = [
                                { value: '', text: 'Seleccione un período...' },
                                { label: 'Bimestral', opts: bimestralOptions },
                                { label: 'Cuatrimestral', opts: cuatrimestralOptions }
                            ];
                        } else if (type === 'INCOME_TAX' || type === 'PATRIMONY') {
                            options = [...anualOptions];
                        } else if (type === 'INDUSTRY_COMMERCE') {
                            options = [
                                { value: '', text: 'Seleccione un período...' },
                                { label: 'Anual', opts: anualOptions },
                                { label: 'Semestral', opts: semestralOptions },
                                { label: 'Cuatrimestral', opts: cuatrimestralOptions },
                                { label: 'Trimestral', opts: trimestralOptions },
                                { label: 'Bimestral', opts: bimestralOptions }
                            ];
                        }

                        let totalSelectable = 0;

                        const appendOpt = (opt, parent) => {
                            const el = document.createElement('option');
                            el.value = opt.value;
                            el.textContent = opt.text;
                            
                            if (opt.value && opt.value !== '') totalSelectable++;
                            
                            if (opt.value === initialPeriod) {
                                el.selected = true;
                            }
                            parent.appendChild(el);
                        };

                        options.forEach(item => {
                            if (item.opts) {
                                const group = document.createElement('optgroup');
                                group.label = item.label;
                                item.opts.forEach(opt => appendOpt(opt, group));
                                periodSelect.appendChild(group);
                            } else {
                                appendOpt(item, periodSelect);
                            }
                        });

                        if (totalSelectable === 1) {
                            const singleOpt = periodSelect.querySelector('option[value]:not([value=""])');
                            if (singleOpt) {
                                singleOpt.selected = true;
                            }
                        } else if (!periodSelect.value) {
                            const emptyOpt = periodSelect.querySelector('option[value=""]');
                            if (emptyOpt) emptyOpt.selected = true;
                        }
                    } catch (e) {
                        console.error("Error actualizando periodos fiscales:", e);
                        alert("Hubo un error configurando los periodos fiscales. Revisa la consola.");
                    }
                }

                // Ejecutar inmediatamente al cargar y asegurarse de adjuntarlo
                document.addEventListener('DOMContentLoaded', () => {
                    updateFiscalPeriods();
                    
                    const form = document.querySelector('#fiscal-period-select') ? document.querySelector('#fiscal-period-select').closest('form') : null;
                    if (form) {
                        form.addEventListener('submit', () => {
                            const periodSelect = document.getElementById('fiscal-period-select');
                            if (periodSelect) periodSelect.disabled = false;
                        });
                    }
                });
            </script>
        </section>
    </section>
</body>
</html>
