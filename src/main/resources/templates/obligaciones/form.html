<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva obligación | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body th:replace="~{fragments/layout :: shell('Nueva obligación', 'Registro de vencimientos y períodos fiscales por cliente', 'obligaciones', ~{::content})}">
    <section th:fragment="content" class="page-stack">
        <section class="panel-card">
            <div class="panel-header">
                <div>
                    <p class="eyebrow">Obligaciones</p>
                    <h3 th:text="${editId != null ? 'Editar obligación' : (contribuyente != null ? 'Nueva obligación para ' + contribuyente.businessName : 'Nueva obligación')}">Nueva obligación</h3>
                </div>
                <a th:href="${contribuyente != null ? '/obligaciones?taxPayerId=' + contribuyente.id : '/obligaciones'}" class="secondary-action">&larr; Volver</a>
            </div>

            <div class="alert-line alert-error" th:if="${error != null}" th:text="${error}">Error</div>

            <form class="form-grid" th:action="${editId != null} ? @{/obligaciones/actualizar/{id}(id=${editId})} : @{/obligaciones/guardar}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <th:block th:if="${contribuyente != null}">
                    <input type="hidden" name="taxPayerId" th:value="${contribuyente.id}" />
                </th:block>

                <label class="field-group" th:unless="${contribuyente != null}">
                    <span class="field-label">Contribuyente</span>
                    <select class="text-input" name="taxPayerId" required>
                        <option value="">Seleccionar contribuyente...</option>
                        <option th:each="c : ${contribuyentes}" th:value="${c.id}" th:text="${c.businessName + ' (' + c.identificacion + ')'}"></option>
                    </select>
                </label>

                <label class="field-group">
                    <span class="field-label">Tipo de obligación</span>
                    <select class="text-input" name="type" id="type-select" required>
                        <option value="">Seleccionar...</option>
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.description}" th:selected="${dto != null && dto.type() == t}"></option>
                    </select>
                </label>

                <label class="field-group">
                    <span class="field-label">Período fiscal</span>
                    <select class="text-input" name="fiscalPeriod" id="fiscal-period-select" required disabled>
                        <option value="">Seleccione primero un tipo de obligación...</option>
                    </select>
                    <!-- Guardar valor original si estamos en modo de edición -->
                    <input type="hidden" id="initialFiscalPeriod" th:value="${dto != null ? dto.fiscalPeriod() : ''}" />
                </label>

                <label class="field-group">
                    <span class="field-label">Año gravable</span>
                    <input class="text-input" type="number" name="taxYear" th:value="${dto != null ? dto.taxYear() : 2026}" min="2020" max="2035" required />
                </label>

                <label class="field-group">
                    <span class="field-label">Fecha de vencimiento (opcional)</span>
                    <input class="text-input" type="date" name="dueDateOverride"
                           th:value="${dto != null && dto.dueDateOverride() != null ? dto.dueDateOverride() : ''}" />
                    <small class="field-hint">Dejar vacío para calcular automáticamente según el calendario tributario</small>
                </label>

                <label class="field-group override-reason" style="display:none">
                    <span class="field-label">Motivo / Notas del cambio de fecha</span>
                    <input class="text-input" type="text" name="dueDateOverrideReason" id="dueDateOverrideReason" placeholder="Requerido si ingresas fecha manual" th:value="${dto != null ? dto.dueDateOverrideReason() : ''}"/>
                </label>

                <label class="field-group">
                    <span class="field-label">Notas (opcional)</span>
                    <textarea class="text-input textarea" name="notes" placeholder="Notas adicionales"
                              th:text="${dto != null ? dto.notes() : ''}"></textarea>
                </label>

                <div class="form-actions">
                    <button class="primary-action" type="submit">Guardar obligación</button>
                    <a th:href="${contribuyente != null ? '/obligaciones?taxPayerId=' + contribuyente.id : '/obligaciones'}" class="secondary-action">Cancelar</a>
                </div>
            </form>
        </section>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const overrideInput = document.querySelector('input[name="dueDateOverride"]');
            const overrideReason = document.querySelector('.override-reason');
            const reasonInput = document.getElementById('dueDateOverrideReason');

            function toggleReason() {
                if (overrideInput.value) {
                    overrideReason.style.display = 'block';
                    reasonInput.setAttribute('required', 'required');
                } else {
                    overrideReason.style.display = 'none';
                    reasonInput.removeAttribute('required');
                }
            }

            if (overrideInput) {
                overrideInput.addEventListener('change', toggleReason);
                toggleReason(); // Check initial state (e.g. for edit mode)
            }

            // Lógica para el selector dinámico de período fiscal
            const typeSelect = document.getElementById('type-select');
            const periodSelect = document.getElementById('fiscal-period-select');
            const initialPeriod = document.getElementById('initialFiscalPeriod').value;

            function updateFiscalPeriods() {
                const type = typeSelect.value;
                periodSelect.innerHTML = '';
                
                if (!type) {
                    periodSelect.innerHTML = '<option value="">Seleccione primero un tipo de obligación...</option>';
                    periodSelect.disabled = true;
                    return;
                }
                
                periodSelect.disabled = false;
                
                const year = new Date().getFullYear() + 2; // asumiendo 2026 como predeterminado en el sistema
                let options = [];

                if (type === 'WITHHOLDING') {
                    // Mensual
                    options.push({ value: '', text: 'Seleccione un mes...' });
                    for (let i = 1; i <= 12; i++) {
                        const monthStr = i.toString().padStart(2, '0');
                        options.push({ value: `${year}-${monthStr}`, text: `Mes ${i} (${year}-${monthStr})` });
                    }
                } else if (type === 'VAT') {
                    // Bimestral y Cuatrimestral
                    options.push({ value: '', text: 'Seleccione un período...' });
                    for (let i = 1; i <= 6; i++) {
                        options.push({ value: `${year}-B${i}`, text: `Bimestre ${i} (${year}-B${i})` });
                    }
                    for (let i = 1; i <= 3; i++) {
                        options.push({ value: `${year}-Q${i}`, text: `Cuatrimestre ${i} (${year}-Q${i})` });
                    }
                } else if (type === 'INCOME_TAX' || type === 'PATRIMONY') {
                    // Anual
                    options.push({ value: `${year}`, text: `Anual (${year})` });
                    options.push({ value: `${year - 1}`, text: `Anual (${year - 1})` });
                } else if (type === 'INDUSTRY_COMMERCE') {
                    // Anual o Bimestral
                    options.push({ value: '', text: 'Seleccione un período...' });
                    options.push({ value: `${year}`, text: `Anual (${year})` });
                    options.push({ value: `${year - 1}`, text: `Anual (${year - 1})` });
                    for (let i = 1; i <= 6; i++) {
                        options.push({ value: `${year}-B${i}`, text: `Bimestre ${i} (${year}-B${i})` });
                    }
                }

                options.forEach(opt => {
                    const el = document.createElement('option');
                    el.value = opt.value;
                    el.textContent = opt.text;
                    if (opt.value === initialPeriod) {
                        el.selected = true;
                    }
                    periodSelect.appendChild(el);
                });
            }

            typeSelect.addEventListener('change', updateFiscalPeriods);
            
            // Inicializar al cargar si hay un tipo ya seleccionado (ej. modo edición)
            if (typeSelect.value) {
                updateFiscalPeriods();
            }
        });
    </script>
</body>
</html>
