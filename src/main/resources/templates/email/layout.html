<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProWeb - Cronos</title>
    <!-- Los estilos deben ser inline para compatibilidad máxima con clientes de correo -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f9fa; /* Fondo gris muy claro */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #334155; /* Texto oscuro corporativo */
            -webkit-font-smoothing: antialiased;
        }
        .email-wrapper {
            width: 100%;
            background-color: #f7f9fa;
            padding: 40px 0;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .email-header {
            background-color: #1e293b; /* Tono oscuro contrastante corporativo */
            padding: 24px;
            text-align: center;
        }
        .email-header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .email-body {
            padding: 32px 24px;
            background-color: #ffffff;
            line-height: 1.6;
        }
        .email-footer {
            background-color: #f8fafc;
            padding: 24px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 13px;
        }
        .btn-primary {
            display: inline-block;
            background-color: #3b82f6; /* Azul primario */
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            margin-top: 24px;
            text-align: center;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            background-color: #f8fafc;
            border-radius: 6px;
            overflow: hidden;
        }
        .data-table th, .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .data-table th {
            font-weight: 600;
            color: #475569;
            width: 35%;
        }
        .data-table td {
            color: #1e293b;
            font-weight: 500;
        }
        .data-table tr:last-child td, .data-table tr:last-child th {
            border-bottom: none;
        }
        .alert-box {
            background-color: #fef2f2;
            border-left: 4px solid #ef4444;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 24px;
        }
        .alert-box p {
            margin: 0;
            color: #991b1b;
            font-weight: 500;
        }
    </style>
</head>
<!-- Plantilla base (shell) para los correos HTML -->
<div th:fragment="shell(content)">
    <div class="email-wrapper">
        <div class="email-container">
            <!-- HEADER -->
            <div class="email-header">
                <h1>Cronos | ProWeb</h1>
            </div>

            <!-- BODY -->
            <div class="email-body">
                <div th:replace="${content}">
                    <!-- El contenido de las plantillas hijas irá aquí -->
                </div>
            </div>

            <!-- FOOTER -->
            <div class="email-footer">
                <p style="margin: 0 0 8px 0;">Este es un mensaje automático del sistema ProWeb.</p>
                <p style="margin: 0; font-size: 12px;">Por favor, no respondas a este correo.</p>
                <p style="margin: 16px 0 0 0; font-size: 11px;">&copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> Cronos. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
