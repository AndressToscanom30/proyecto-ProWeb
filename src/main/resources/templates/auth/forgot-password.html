<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-brand">C</div>

        <div class="auth-header">
            <h1>Recuperar contraseña</h1>
            <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.</p>
        </div>

        <div class="auth-card">
            <div class="alert-line alert-success" th:if="${success}" th:text="${success}"></div>

            <form class="auth-form" th:action="@{/forgot-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label class="field-group">
                    <span class="field-label">Correo electrónico</span>
                    <input class="text-input" type="email" name="email" placeholder="usuario@correo.com" required />
                </label>

                <button class="primary-action" type="submit" style="margin-bottom: 16px;">Enviar enlace</button>
                
                <div style="text-align: center;">
                    <a th:href="@{/login}" style="font-size: 13px; color: var(--text-secondary); text-decoration: none;">Volver al inicio de sesión</a>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
