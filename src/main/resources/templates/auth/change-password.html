<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambiar contraseña | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body th:replace="~{fragments/layout :: shell('Cambiar contraseña', 'Actualiza tu contraseña de acceso de forma segura', 'configuracion', ~{::content})}">
    <section th:fragment="content" class="page-stack">
        <section class="page-hero">
            <div>
                <p class="eyebrow">Seguridad</p>
                <h2>Cambiar contraseña</h2>
                <p>Actualiza tu contraseña de acceso de forma segura.</p>
            </div>
            <div class="hero-meta">
                <a th:href="@{/dashboard}" class="secondary-action">Volver al dashboard</a>
            </div>
        </section>

        <section class="panel-card" style="max-width: 600px;">
            <div class="panel-header">
                <div>
                    <p class="eyebrow">Cuenta</p>
                    <h3>Nueva contraseña</h3>
                    <small>Debe tener al menos 8 caracteres</small>
                </div>
            </div>

            <div class="alert-line alert-success" th:if="${success}" th:text="${success}"></div>
            <div class="alert-line alert-error" th:if="${error}" th:text="${error}"></div>

            <form class="form-grid" th:action="@{/profile/change-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label class="field-group">
                    <span class="field-label">Contraseña actual</span>
                    <input class="text-input" type="password" name="oldPassword" required />
                </label>

                <label class="field-group">
                    <span class="field-label">Nueva contraseña</span>
                    <input class="text-input" type="password" name="newPassword" placeholder="Mínimo 8 caracteres" required minlength="8" />
                </label>

                <label class="field-group">
                    <span class="field-label">Confirmar nueva contraseña</span>
                    <input class="text-input" type="password" name="confirmPassword" placeholder="Vuelve a escribir la nueva contraseña" required minlength="8" />
                </label>

                <div class="form-actions">
                    <button class="primary-action" type="submit">Guardar cambios</button>
                    <a th:href="@{/dashboard}" class="secondary-action">Cancelar</a>
                </div>
            </form>
        </section>
    </section>
</body>
</html>
