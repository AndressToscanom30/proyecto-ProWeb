<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-brand">C</div>

        <div class="auth-header">
            <h1>Iniciar sesión</h1>
            <p>Accede a tu cuenta para revisar vencimientos, obligaciones y recordatorios.</p>
        </div>

        <div class="auth-card">
            <div class="alert-line alert-error" th:if="${param.error}">
                Correo o contraseña incorrectos.
            </div>
            <div class="alert-line alert-success" th:if="${param.logout}">
                Sesión cerrada correctamente.
            </div>

            <form class="auth-form" th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label class="field-group">
                    <span class="field-label">Correo</span>
                    <input class="text-input" type="email" name="username" placeholder="usuario@correo.com" autocomplete="username" required />
                </label>

                <label class="field-group">
                    <span class="field-label">Contraseña</span>
                    <input class="text-input" type="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required />
                </label>

                <div style="text-align: right; margin-top: -8px; margin-bottom: 24px;">
                    <a th:href="@{/forgot-password}" style="font-size: 13px; color: var(--accent); text-decoration: none;">¿Olvidaste tu contraseña?</a>
                </div>

                <button class="primary-action" type="submit">Entrar</button>
            </form>
        </div>

    </div>
</body>
</html>
