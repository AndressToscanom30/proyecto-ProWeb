<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Establecer nueva contraseña | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-brand">C</div>

        <div class="auth-header">
            <h1>Nueva contraseña</h1>
            <p>Ingresa y confirma tu nueva contraseña de acceso.</p>
        </div>

        <div class="auth-card">
            <div class="alert-line alert-error" th:if="${error}" th:text="${error}"></div>

            <form class="auth-form" th:action="@{/reset-password}" method="post" th:if="${token != null}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="token" th:value="${token}" />

                <label class="field-group">
                    <span class="field-label">Nueva contraseña</span>
                    <input class="text-input" type="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8" />
                </label>

                <label class="field-group">
                    <span class="field-label">Confirmar contraseña</span>
                    <input class="text-input" type="password" name="confirmPassword" placeholder="Vuelve a escribir la contraseña" required minlength="8" />
                </label>

                <button class="primary-action" type="submit">Guardar contraseña</button>
            </form>
            
            <div th:if="${token == null}" style="text-align: center; margin-top: 16px;">
                <a th:href="@{/login}" class="secondary-action">Volver al inicio de sesión</a>
            </div>
        </div>

    </div>
</body>
</html>
