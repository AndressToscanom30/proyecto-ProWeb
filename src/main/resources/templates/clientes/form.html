<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${contribuyente != null and contribuyente.id != null ? 'Editar cliente | Cronos' : 'Nuevo cliente | Cronos'}">Cliente | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body th:replace="~{fragments/layout :: shell(${contribuyente != null and contribuyente.id != null ? 'Editar cliente' : 'Nuevo cliente'}, 'Formulario de alta y actualización de contribuyentes', 'clientes', ~{::content})}">
    <section th:fragment="content" class="page-stack">
        <section class="panel-card">
            <div class="panel-header">
                <div>
                    <p class="eyebrow">Clientes</p>
                    <h3 th:text="${contribuyente != null and contribuyente.id != null ? 'Editar contribuyente' : 'Nuevo contribuyente'}">Formulario</h3>
                </div>
                <a th:href="@{/clientes}" class="secondary-action">&larr; Volver</a>
            </div>

            <form class="form-grid" th:action="@{/clientes/guardar}" th:object="${contribuyente}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" th:field="*{id}" />

                <label class="field-group">
                    <span class="field-label">Razón social / Nombre</span>
                    <input class="text-input" type="text" th:field="*{businessName}" placeholder="Nombre o razón social" />
                    <small class="field-error" th:errors="*{businessName}"></small>
                </label>

                <label class="field-group">
                    <span class="field-label">Identificación (NIT / CC)</span>
                    <input class="text-input" type="text" th:field="*{identificacion}" placeholder="NIT o cédula" />
                    <small class="field-error" th:errors="*{identificacion}"></small>
                </label>

                <div class="form-row">
                    <label class="field-group">
                        <span class="field-label">Tipo de persona</span>
                        <select class="text-input" th:field="*{type}">
                            <option th:value="NATURAL_PERSON">Persona natural</option>
                            <option th:value="LEGAL_ENTITY">Persona jurídica</option>
                        </select>
                    </label>

                    <label class="field-group">
                        <span class="field-label">Email</span>
                        <input class="text-input" type="email" th:field="*{email}" placeholder="correo@ejemplo.com" />
                        <small class="field-error" th:errors="*{email}"></small>
                    </label>
                </div>

                <div class="form-row">
                    <label class="field-group">
                        <span class="field-label">Teléfono</span>
                        <input class="text-input" type="text" th:field="*{phone}" placeholder="Teléfono" />
                    </label>

                    <label class="field-group">
                        <span class="field-label">Gran contribuyente</span>
                        <select class="text-input" th:field="*{granContribuyente}">
                            <option th:value="false">No</option>
                            <option th:value="true">Si</option>
                        </select>
                    </label>
                </div>

                <label class="field-group">
                    <span class="field-label">Dirección</span>
                    <input class="text-input" type="text" th:field="*{address}" placeholder="Dirección" />
                </label>

                <label class="field-group">
                    <span class="field-label">Estado</span>
                    <select class="text-input" th:field="*{active}">
                        <option th:value="true">Activo</option>
                        <option th:value="false">Inactivo</option>
                    </select>
                </label>

                <input type="hidden" th:field="*{registrationDate}" />

                <div class="form-actions">
                    <button class="primary-action" type="submit" th:text="${contribuyente != null and contribuyente.id != null ? 'Actualizar' : 'Guardar'}">Guardar</button>
                    <a th:href="@{/clientes}" class="secondary-action">Cancelar</a>
                </div>
            </form>
        </section>
    </section>
</body>
</html>
