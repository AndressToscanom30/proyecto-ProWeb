<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes | TaxControl</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body th:replace="~{fragments/layout :: shell('Clientes', 'Gestiona contribuyentes, su estado y acceso a sus obligaciones', 'clientes', ~{::content})}">
    <section th:fragment="content" class="page-stack">
        <section class="panel-card">
            <div class="panel-header">
                <div>
                    <p class="eyebrow">Contribuyentes</p>
                    <h3>Base de clientes</h3>
                </div>
                <a sec:authorize="hasRole('GERENTE')" th:href="@{/clientes/nuevo}" class="primary-action" style="width:auto">+ Nuevo contribuyente</a>
            </div>

            <div th:if="${#lists.isEmpty(contribuyentes)}" class="empty-state">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <p>No hay contribuyentes registrados.</p>
                <a sec:authorize="hasRole('GERENTE')" th:href="@{/clientes/nuevo}" class="primary-action" style="width:auto">Crear primer contribuyente</a>
            </div>

            <div class="table-wrap" th:if="${not #lists.isEmpty(contribuyentes)}">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Razón social</th>
                            <th>Identificación</th>
                            <th>Tipo</th>
                            <th>Email</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${contribuyentes}">
                            <td>
                                <a th:href="@{/obligaciones(taxPayerId=${c.id})}" class="table-link" th:text="${c.businessName}">Nombre</a>
                            </td>
                            <td th:text="${c.identificacion}">NIT</td>
                            <td>
                                <span class="chip" th:text="${c.type == 'LEGAL_ENTITY' ? 'Persona jurídica' : 'Persona natural'}">Tipo</span>
                            </td>
                            <td th:text="${c.email}">email</td>
                            <td>
                                <span class="pill tone-success" th:if="${c.active}">Activo</span>
                                <span class="pill tone-danger" th:if="${!c.active}">Inactivo</span>
                            </td>
                            <td>
                                <div class="action-group">
                                    <a sec:authorize="hasRole('GERENTE')" th:href="@{/clientes/editar/{id}(id=${c.id})}" class="action-link">Editar</a>
                                    <a th:href="@{/obligaciones(taxPayerId=${c.id})}" class="action-link">Obligaciones</a>
                                    <a sec:authorize="hasRole('GERENTE')" th:href="@{/clientes/eliminar/{id}(id=${c.id})}" class="action-link action-danger"
                                       data-confirm="Eliminar este contribuyente?">Eliminar</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </section>
</body>
</html>
