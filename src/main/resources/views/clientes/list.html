<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contribuyentes | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="dashboard-page">
    <main class="dashboard-shell">
        <header class="topbar">
            <div class="topbar-left">
                <a th:href="@{/dashboard}" class="topbar-brand">CT</a>
                <nav class="topbar-nav">
                    <a th:href="@{/dashboard}" class="nav-link">Dashboard</a>
                    <a th:href="@{/clientes}" class="nav-link active">Contribuyentes</a>
                    <a th:href="@{/empleados}" class="nav-link">Empleados</a>
                    <a th:href="@{/admin}" class="nav-link" sec:authorize="hasRole('ADMIN')">Admin</a>
                </nav>
            </div>
            <div class="topbar-right">
                <span class="pill pill-accent" th:text="${usuario.role != null ? usuario.role.name : 'ROLE_USER'}">ROLE_USER</span>
                <span class="topbar-user" th:text="${usuario.name}">Usuario</span>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="secondary-btn" type="submit">Cerrar sesion</button>
                </form>
            </div>
        </header>

        <section class="panel-card">
            <div class="panel-header">
                <h3>Contribuyentes</h3>
                <a sec:authorize="hasRole('GERENTE')" th:href="@{/clientes/nuevo}" class="primary-action" style="width:auto;padding:0 1.25rem;height:38px;font-size:0.85rem;text-decoration:none">
                    + Nuevo contribuyente
                </a>
            </div>

            <div th:if="${#lists.isEmpty(contribuyentes)}" class="empty-state">
                <div class="empty-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <p>No hay contribuyentes registrados.</p>
                <a sec:authorize="hasRole('GERENTE')" th:href="@{/clientes/nuevo}" class="primary-action" style="width:auto;padding:0 1.5rem;text-decoration:none">Crear primer contribuyente</a>
            </div>

            <div class="table-wrap" th:if="${not #lists.isEmpty(contribuyentes)}">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Razon social</th>
                            <th>Identificacion</th>
                            <th>Tipo</th>
                            <th>Email</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${contribuyentes}">
                            <td>
                                <a th:href="@{/obligaciones(taxPayerId=${c.id})}" class="table-link" th:text="${c.businessName}">Nombre</a>
                            </td>
                            <td th:text="${c.identificacion}">NIT</td>
                            <td>
                                <span class="chip" th:text="${c.type == 'LEGAL_ENTITY' ? 'Persona juridica' : 'Persona natural'}">Tipo</span>
                            </td>
                            <td th:text="${c.email}">email</td>
                            <td>
                                <span class="pill pill-success" th:if="${c.active}">Activo</span>
                                <span class="pill pill-danger" th:if="${!c.active}">Inactivo</span>
                            </td>
                            <td>
                                <div class="action-group">
                                    <a sec:authorize="hasRole('GERENTE')" th:href="@{/clientes/editar/{id}(id=${c.id})}" class="action-link">Editar</a>
                                    <a th:href="@{/obligaciones(taxPayerId=${c.id})}" class="action-link">Obligaciones</a>
                                    <a sec:authorize="hasRole('GERENTE')" th:href="@{/clientes/eliminar/{id}(id=${c.id})}" class="action-link action-danger"
                                       onclick="return confirm('Eliminar este contribuyente?')">Eliminar</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
