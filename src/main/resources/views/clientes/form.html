<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${contribuyente.id != null ? 'Editar contribuyente | Cronos' : 'Nuevo contribuyente | Cronos'}">Contribuyente | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="dashboard-page">
    <main class="dashboard-shell">
        <header class="topbar">
            <div class="topbar-left">
                <a th:href="@{/dashboard}" class="topbar-brand">CT</a>
                <nav class="topbar-nav">
                    <a th:href="@{/dashboard}" class="nav-link">Dashboard</a>
                    <a th:href="@{/clientes}" class="nav-link active">Contribuyentes</a>
                    <a th:href="@{/admin}" class="nav-link" sec:authorize="hasRole('ADMIN')">Admin</a>
                </nav>
            </div>
            <div class="topbar-right">
                <span class="pill pill-accent" th:text="${usuario.role != null ? usuario.role.name : 'ROLE_USER'}">ROLE_USER</span>
                <span class="topbar-user" th:text="${usuario.name}">Usuario</span>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="secondary-btn" type="submit">Cerrar sesion</button>
                </form>
            </div>
        </header>

        <section class="panel-card">
            <div class="panel-header">
                <h3 th:text="${contribuyente.id != null ? 'Editar contribuyente' : 'Nuevo contribuyente'}">Formulario</h3>
                <a th:href="@{/clientes}" class="secondary-btn" style="text-decoration:none">&larr; Volver</a>
            </div>

            <form class="form-grid" th:action="@{/clientes/guardar}" th:object="${contribuyente}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" th:field="*{id}" />

                <label class="field-group">
                    <span class="field-label">Razon social / Nombre</span>
                    <input class="text-input" type="text" th:field="*{businessName}" placeholder="Nombre o razon social" />
                    <small class="field-error" th:errors="*{businessName}"></small>
                </label>

                <label class="field-group">
                    <span class="field-label">Identificacion (NIT / CC)</span>
                    <input class="text-input" type="text" th:field="*{identificacion}" placeholder="NIT o cedula" />
                    <small class="field-error" th:errors="*{identificacion}"></small>
                </label>

                <div class="form-row">
                    <label class="field-group">
                        <span class="field-label">Tipo de persona</span>
                        <select class="text-input" th:field="*{type}">
                            <option th:value="NATURAL_PERSON">Persona natural</option>
                            <option th:value="LEGAL_ENTITY">Persona juridica</option>
                        </select>
                    </label>

                    <label class="field-group">
                        <span class="field-label">Email</span>
                        <input class="text-input" type="email" th:field="*{email}" placeholder="correo@ejemplo.com" />
                        <small class="field-error" th:errors="*{email}"></small>
                    </label>
                </div>

                <div class="form-row">
                    <label class="field-group">
                        <span class="field-label">Telefono</span>
                        <input class="text-input" type="text" th:field="*{phone}" placeholder="Telefono" />
                    </label>

                    <label class="field-group">
                        <span class="field-label">Gran contribuyente</span>
                        <select class="text-input" th:field="*{granContribuyente}">
                            <option th:value="false">No</option>
                            <option th:value="true">Si</option>
                        </select>
                    </label>
                </div>

                <label class="field-group">
                    <span class="field-label">Direccion</span>
                    <input class="text-input" type="text" th:field="*{address}" placeholder="Direccion" />
                </label>

                <label class="field-group">
                    <span class="field-label">Estado</span>
                    <select class="text-input" th:field="*{active}">
                        <option th:value="true">Activo</option>
                        <option th:value="false">Inactivo</option>
                    </select>
                </label>

                <input type="hidden" th:field="*{registrationDate}" />

                <div class="form-actions">
                    <button class="primary-action" type="submit" th:text="${contribuyente.id != null ? 'Actualizar' : 'Guardar'}">Guardar</button>
                    <a th:href="@{/clientes}" class="secondary-action" style="text-decoration:none">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
