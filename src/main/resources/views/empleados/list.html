<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equipo | TaxControl</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body th:replace="~{fragments/layout :: shell('Equipo', 'Administración de personal operativo, asignación de roles y control de accesos', 'equipo', ~{::content})}">
    <section th:fragment="content" class="page-stack">
        <section class="panel-card">
            <div class="panel-header">
                <div>
                    <p class="eyebrow">Equipo</p>
                    <h3>Directorio de empleados</h3>
                </div>
                <a sec:authorize="hasRole('GERENTE')" th:href="@{/empleados/nuevo}" class="primary-action" style="width:auto">+ Nuevo empleado</a>
            </div>

            <div th:if="${#lists.isEmpty(empleados)}" class="empty-state">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <p>No hay empleados registrados.</p>
                <a sec:authorize="hasRole('GERENTE')" th:href="@{/empleados/nuevo}" class="primary-action" style="width:auto">Crear primer empleado</a>
            </div>

            <div class="table-wrap" th:if="${not #lists.isEmpty(empleados)}">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${empleados}">
                            <td th:text="${e.name}">Nombre</td>
                            <td th:text="${e.email}">Email</td>
                            <td>
                                <span class="chip" th:text="${e.role != null ? e.role.description : 'Sin rol'}">Rol</span>
                            </td>
                            <td th:text="${e.phone}">Teléfono</td>
                            <td>
                                <span class="pill tone-success" th:if="${e.active}">Activo</span>
                                <span class="pill tone-danger" th:if="${!e.active}">Inactivo</span>
                            </td>
                            <td>
                                <div class="action-group">
                                    <a sec:authorize="hasRole('GERENTE')" th:href="@{/empleados/editar/{id}(id=${e.id})}" class="action-link">Editar</a>
                                    <a sec:authorize="hasRole('GERENTE')" th:href="@{/empleados/eliminar/{id}(id=${e.id})}" class="action-link action-danger"
                                       data-confirm="Eliminar este empleado?">Eliminar</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </section>
</body>
</html>
