<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empleados | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="dashboard-page">
    <main class="dashboard-shell">
        <header class="topbar">
            <div class="topbar-left">
                <a th:href="@{/dashboard}" class="topbar-brand">CT</a>
                <nav class="topbar-nav">
                    <a th:href="@{/dashboard}" class="nav-link">Dashboard</a>
                    <a th:href="@{/clientes}" class="nav-link">Contribuyentes</a>
                    <a th:href="@{/empleados}" class="nav-link active">Empleados</a>
                    <a th:href="@{/admin}" class="nav-link" sec:authorize="hasRole('ADMIN')">Admin</a>
                </nav>
            </div>
            <div class="topbar-right">
                <span class="pill pill-accent" th:text="${usuario.role != null ? usuario.role.name : 'ROLE_USER'}">ROLE_USER</span>
                <span class="topbar-user" th:text="${usuario.name}">Usuario</span>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="secondary-btn" type="submit">Cerrar sesion</button>
                </form>
            </div>
        </header>

        <section class="panel-card">
            <div class="panel-header">
                <h3>Empleados</h3>
                <a sec:authorize="hasRole('GERENTE')" th:href="@{/empleados/nuevo}" class="primary-action" style="width:auto;padding:0 1.25rem;height:38px;font-size:0.85rem;text-decoration:none">
                    + Nuevo empleado
                </a>
            </div>

            <div th:if="${#lists.isEmpty(empleados)}" class="empty-state">
                <div class="empty-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <p>No hay empleados registrados.</p>
                <a sec:authorize="hasRole('GERENTE')" th:href="@{/empleados/nuevo}" class="primary-action" style="width:auto;padding:0 1.5rem;text-decoration:none">Crear primer empleado</a>
            </div>

            <div class="table-wrap" th:if="${not #lists.isEmpty(empleados)}">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Cargo</th>
                            <th>Rol</th>
                            <th>Telefono</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${empleados}">
                            <td th:text="${e.name}">Nombre</td>
                            <td th:text="${e.email}">Email</td>
                            <td th:text="${e.position}">Cargo</td>
                            <td>
                                <span class="chip" th:text="${e.role != null ? e.role.description : 'Sin rol'}">Rol</span>
                            </td>
                            <td th:text="${e.phone}">Telefono</td>
                            <td>
                                <span class="pill pill-success" th:if="${e.active}">Activo</span>
                                <span class="pill pill-danger" th:if="${!e.active}">Inactivo</span>
                            </td>
                            <td>
                                <div class="action-group">
                                    <a sec:authorize="hasRole('GERENTE')" th:href="@{/empleados/eliminar/{id}(id=${e.id})}" class="action-link action-danger"
                                       onclick="return confirm('Eliminar este empleado?')">Eliminar</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
