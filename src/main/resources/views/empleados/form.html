<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo empleado | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="dashboard-page">
    <main class="dashboard-shell">
        <header class="topbar">
            <div class="topbar-left">
                <a th:href="@{/dashboard}" class="topbar-brand">CT</a>
                <nav class="topbar-nav">
                    <a th:href="@{/dashboard}" class="nav-link">Dashboard</a>
                    <a th:href="@{/clientes}" class="nav-link">Contribuyentes</a>
                    <a th:href="@{/empleados}" class="nav-link active">Empleados</a>
                    <a th:href="@{/admin}" class="nav-link" sec:authorize="hasRole('ADMIN')">Admin</a>
                </nav>
            </div>
            <div class="topbar-right">
                <span class="pill pill-accent" th:text="${usuario.role != null ? usuario.role.name : 'ROLE_USER'}">ROLE_USER</span>
                <span class="topbar-user" th:text="${usuario.name}">Usuario</span>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="secondary-btn" type="submit">Cerrar sesion</button>
                </form>
            </div>
        </header>

        <section class="panel-card">
            <div class="panel-header">
                <h3>Nuevo empleado</h3>
                <a th:href="@{/empleados}" class="secondary-btn" style="text-decoration:none">&larr; Volver</a>
            </div>

            <div class="alert-line alert-error" th:if="${error != null}" th:text="${error}">Error</div>

            <form class="form-grid" th:action="@{/empleados/guardar}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label class="field-group">
                    <span class="field-label">Nombre completo</span>
                    <input class="text-input" type="text" name="name" placeholder="Nombre del empleado" th:value="${name}" required />
                </label>

                <label class="field-group">
                    <span class="field-label">Email</span>
                    <input class="text-input" type="email" name="email" placeholder="correo@ejemplo.com" th:value="${email}" required />
                </label>

                <label class="field-group">
                    <span class="field-label">Contrasena</span>
                    <input class="text-input" type="password" name="password" placeholder="Minimo 8 caracteres" required />
                </label>

                <div class="form-row">
                    <label class="field-group">
                        <span class="field-label">Rol</span>
                        <select class="text-input" name="role" required>
                            <option value="">Seleccionar...</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${role == r}"></option>
                        </select>
                    </label>

                    <label class="field-group">
                        <span class="field-label">Telefono</span>
                        <input class="text-input" type="text" name="phone" placeholder="Telefono" th:value="${phone}" />
                    </label>
                </div>

                <label class="field-group">
                    <span class="field-label">Cargo</span>
                    <input class="text-input" type="text" name="position" placeholder="Cargo o puesto" th:value="${position}" />
                </label>

                <div class="form-actions">
                    <button class="primary-action" type="submit">Crear empleado</button>
                    <a th:href="@{/empleados}" class="secondary-action" style="text-decoration:none">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
