<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva obligacion | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="dashboard-page">
    <main class="dashboard-shell">
        <header class="topbar">
            <div class="topbar-left">
                <a th:href="@{/dashboard}" class="topbar-brand">CT</a>
                <nav class="topbar-nav">
                    <a th:href="@{/dashboard}" class="nav-link">Dashboard</a>
                    <a th:href="@{/clientes}" class="nav-link active">Contribuyentes</a>
                    <a th:href="@{/admin}" class="nav-link" sec:authorize="hasRole('ADMIN')">Admin</a>
                </nav>
            </div>
            <div class="topbar-right">
                <span class="pill pill-accent" th:text="${usuario.role != null ? usuario.role.name : 'ROLE_USER'}">ROLE_USER</span>
                <span class="topbar-user" th:text="${usuario.name}">Usuario</span>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="secondary-btn" type="submit">Cerrar sesion</button>
                </form>
            </div>
        </header>

        <section class="panel-card">
            <div class="panel-header">
                <h3>Nueva obligacion para <span th:text="${contribuyente.businessName}">Contribuyente</span></h3>
                <a th:href="@{/obligaciones(taxPayerId=${contribuyente.id})}" class="secondary-btn" style="text-decoration:none">&larr; Volver</a>
            </div>

            <div class="alert-line alert-error" th:if="${error != null}" th:text="${error}">Error</div>

            <form class="form-grid" th:action="@{/obligaciones/guardar}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="taxPayerId" th:value="${contribuyente.id}" />

                <label class="field-group">
                    <span class="field-label">Tipo de obligacion</span>
                    <select class="text-input" name="type" required>
                        <option value="">Seleccionar...</option>
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}" th:selected="${dto != null && dto.type() == t}"></option>
                    </select>
                </label>

                <label class="field-group">
                    <span class="field-label">Periodo fiscal</span>
                    <input class="text-input" type="text" name="fiscalPeriod" placeholder="Ej: 2026-01, 2026-B1, 2026-Q1, 2026"
                           th:value="${dto != null ? dto.fiscalPeriod() : ''}" required />
                    <small class="field-hint">Mensual: 2026-01 | Bimestral: 2026-B1 | Cuatrimestral: 2026-Q1 | Anual: 2026</small>
                </label>

                <label class="field-group">
                    <span class="field-label">Año gravable</span>
                    <input class="text-input" type="number" name="taxYear" th:value="${dto != null ? dto.taxYear() : 2026}" min="2020" max="2035" required />
                </label>

                <label class="field-group">
                    <span class="field-label">Fecha de vencimiento (opcional)</span>
                    <input class="text-input" type="date" name="dueDateOverride"
                           th:value="${dto != null && dto.dueDateOverride() != null ? dto.dueDateOverride() : ''}" />
                    <small class="field-hint">Dejar vacio para calcular automaticamente segun el calendario tributario</small>
                </label>

                <label class="field-group override-reason" style="display:none">
                    <span class="field-label">Motivo del cambio de fecha</span>
                    <input class="text-input" type="text" name="dueDateOverrideReason" placeholder="Razon obligatoria si ingresas fecha manual" />
                </label>

                <label class="field-group">
                    <span class="field-label">Notas (opcional)</span>
                    <textarea class="text-input textarea" name="notes" placeholder="Notas adicionales"
                              th:text="${dto != null ? dto.notes() : ''}"></textarea>
                </label>

                <div class="form-actions">
                    <button class="primary-action" type="submit">Guardar obligacion</button>
                    <a th:href="@{/obligaciones(taxPayerId=${contribuyente.id})}" class="secondary-action" style="text-decoration:none">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const overrideInput = document.querySelector('input[name="dueDateOverride"]');
            const overrideReason = document.querySelector('.override-reason');
            if (overrideInput) {
                overrideInput.addEventListener('change', function() {
                    overrideReason.style.display = this.value ? 'block' : 'none';
                });
            }
        });
    </script>
</body>
</html>
