<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obligaciones | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="dashboard-page">
    <main class="dashboard-shell">
        <header class="topbar">
            <div class="topbar-left">
                <a th:href="@{/dashboard}" class="topbar-brand">CT</a>
                <nav class="topbar-nav">
                    <a th:href="@{/dashboard}" class="nav-link">Dashboard</a>
                    <a th:href="@{/clientes}" class="nav-link active">Contribuyentes</a>
                    <a th:href="@{/admin}" class="nav-link" sec:authorize="hasRole('ADMIN')">Admin</a>
                </nav>
            </div>
            <div class="topbar-right">
                <span class="pill pill-accent" th:text="${usuario.role != null ? usuario.role.name : 'ROLE_USER'}">ROLE_USER</span>
                <span class="topbar-user" th:text="${usuario.name}">Usuario</span>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="secondary-btn" type="submit">Cerrar sesion</button>
                </form>
            </div>
        </header>

        <section class="panel-card">
            <div class="panel-header">
                <h3>
                    Obligaciones de <span th:text="${contribuyente.businessName}">Contribuyente</span>
                    <small th:text="${contribuyente.identificacion}">NIT</small>
                </h3>
                <a th:href="@{/clientes}" class="secondary-btn" style="text-decoration:none">&larr; Volver</a>
            </div>

            <div class="panel-actions">
                <a th:href="@{/obligaciones/nuevo(taxPayerId=${contribuyente.id})}" class="primary-action" style="width:auto;padding:0 1.25rem;height:38px;font-size:0.85rem;text-decoration:none">
                    + Nueva obligacion
                </a>
            </div>

            <div th:if="${#lists.isEmpty(obligaciones)}" class="empty-state">
                <div class="empty-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </div>
                <p>Este contribuyente no tiene obligaciones registradas.</p>
                <a th:href="@{/obligaciones/nuevo(taxPayerId=${contribuyente.id})}" class="primary-action" style="width:auto;padding:0 1.5rem;text-decoration:none">Crear obligacion</a>
            </div>

            <div class="table-wrap" th:if="${not #lists.isEmpty(obligaciones)}">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Periodo</th>
                            <th>Ano</th>
                            <th>Vencimiento</th>
                            <th>Estado</th>
                            <th>Notas</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="o : ${obligaciones}">
                            <td>
                                <span class="type-label" th:text="${o.type}">TIPO</span>
                            </td>
                            <td th:text="${o.fiscalPeriod}">2026-01</td>
                            <td th:text="${o.taxYear}">2026</td>
                            <td>
                                <span th:text="${o.dueDate}" class="due-date"></span>
                                <span class="override-badge" th:if="${o.dueDateOverridden}" title="Fecha ingresada manualmente: ${o.dueDateOverrideReason}">Manual</span>
                            </td>
                            <td>
                                <form th:action="@{/obligaciones/{id}/status(id=${o.id})}" method="post" class="status-form" style="display:inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <input type="hidden" name="taxPayerId" th:value="${contribuyente.id}" />
                                    <select name="newStatus" class="status-select"
                                            th:classappend="'status-' + ${o.status.toString().toLowerCase()}"
                                            onchange="this.form.submit()">
                                        <option th:value="PENDING" th:selected="${o.status == 'PENDING'}">Pendiente</option>
                                        <option th:value="IN_PROGRESS" th:selected="${o.status == 'IN_PROGRESS'}">En progreso</option>
                                        <option th:value="COMPLETED" th:selected="${o.status == 'COMPLETED'}">Completado</option>
                                        <option th:value="OVERDUE" th:selected="${o.status == 'OVERDUE'}">Vencido</option>
                                        <option th:value="CANCELLED" th:selected="${o.status == 'CANCELLED'}">Cancelado</option>
                                    </select>
                                </form>
                            </td>
                            <td th:text="${o.notes}" class="notes-cell">Notas</td>
                            <td>
                                <div class="action-group">
                                    <a th:href="@{/obligaciones/eliminar/{id}(id=${o.id}, taxPayerId=${contribuyente.id})}" class="action-link action-danger"
                                       onclick="return confirm('Eliminar esta obligacion?')">Eliminar</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
