<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obligaciones | TaxControl</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body th:replace="~{fragments/layout :: shell('Obligaciones', 'Calendario fiscal y seguimiento del cumplimiento por cliente', 'obligaciones', ~{::content})}">
    <section th:fragment="content" class="page-stack">
        <section class="panel-card">
            <div class="panel-header">
                <div>
                    <p class="eyebrow">Obligaciones</p>
                    <h3>
                        Obligaciones de <span th:text="${contribuyente.businessName}">Contribuyente</span>
                        <small th:text="${contribuyente.identificacion}">NIT</small>
                    </h3>
                </div>
                <a th:href="@{/clientes}" class="secondary-action">&larr; Volver</a>
            </div>

            <div class="panel-actions">
                <a sec:authorize="hasRole('GERENTE')" th:href="@{/obligaciones/nuevo(taxPayerId=${contribuyente.id})}" class="primary-action" style="width:auto">+ Nueva obligacion</a>
            </div>

            <div th:if="${#lists.isEmpty(obligaciones)}" class="empty-state">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </div>
                <p>Este contribuyente no tiene obligaciones registradas.</p>
                <a sec:authorize="hasRole('GERENTE')" th:href="@{/obligaciones/nuevo(taxPayerId=${contribuyente.id})}" class="primary-action" style="width:auto">Crear obligacion</a>
            </div>

            <div class="table-wrap" th:if="${not #lists.isEmpty(obligaciones)}">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Periodo</th>
                            <th>Ano</th>
                            <th>Vencimiento</th>
                            <th>Estado</th>
                            <th>Notas</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="o : ${obligaciones}">
                            <td>
                                <span class="type-label" th:text="${o.type}">TIPO</span>
                            </td>
                            <td th:text="${o.fiscalPeriod}">2026-01</td>
                            <td th:text="${o.taxYear}">2026</td>
                            <td>
                                <span th:text="${o.dueDate}" class="due-date"></span>
                                <span class="override-badge" th:if="${o.dueDateOverridden}" th:title="|Fecha ingresada manualmente: ${o.dueDateOverrideReason}|">Manual</span>
                            </td>
                            <td>
                                <form th:action="@{/obligaciones/{id}/status(id=${o.id})}" method="post" class="status-form" style="display:inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <input type="hidden" name="taxPayerId" th:value="${contribuyente.id}" />
                                    <select name="newStatus" class="status-select"
                                            th:classappend="'status-' + ${o.status.toString().toLowerCase()}"
                                            onchange="this.form.submit()">
                                        <option th:value="PENDING" th:selected="${o.status == 'PENDING'}">Pendiente</option>
                                        <option th:value="IN_PROGRESS" th:selected="${o.status == 'IN_PROGRESS'}">En progreso</option>
                                        <option th:value="COMPLETED" th:selected="${o.status == 'COMPLETED'}">Completado</option>
                                        <option th:value="OVERDUE" th:selected="${o.status == 'OVERDUE'}">Vencido</option>
                                        <option th:value="CANCELLED" th:selected="${o.status == 'CANCELLED'}">Cancelado</option>
                                    </select>
                                </form>
                            </td>
                            <td th:text="${o.notes}" class="notes-cell">Notas</td>
                            <td>
                                <div class="action-group">
                                    <a sec:authorize="hasRole('GERENTE')" th:href="@{/obligaciones/eliminar/{id}(id=${o.id}, taxPayerId=${contribuyente.id})}" class="action-link action-danger"
                                       data-confirm="Eliminar esta obligacion?">Eliminar</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </section>
</body>
</html>
