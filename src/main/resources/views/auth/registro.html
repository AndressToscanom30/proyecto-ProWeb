<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | TaxControl</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-brand">TC</div>

        <div class="auth-header">
            <h1>Crear cuenta</h1>
            <p>Regístrate para ingresar al sistema y administrar tus accesos de forma segura.</p>
        </div>

        <div class="auth-card">
            <form class="auth-form" th:action="@{/registro}" th:object="${usuario}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label class="field-group">
                    <span class="field-label">Nombre</span>
                    <input class="text-input" type="text" th:field="*{name}" placeholder="Tu nombre completo" autocomplete="name" />
                    <small class="field-error" th:errors="*{name}"></small>
                </label>

                <label class="field-group">
                    <span class="field-label">Correo</span>
                    <input class="text-input" type="email" th:field="*{email}" placeholder="usuario@correo.com" autocomplete="email" />
                    <small class="field-error" th:errors="*{email}"></small>
                </label>

                <label class="field-group">
                    <span class="field-label">Contraseña</span>
                    <input class="text-input" type="password" th:field="*{password}" placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
                    <small class="field-error" th:errors="*{password}"></small>
                </label>

                <button class="primary-action" type="submit">Registrar</button>
            </form>
        </div>

        <p class="auth-footer">
            ¿Ya tienes cuenta?
            <a th:href="@{/login}">Volver al login</a>
        </p>
    </div>
</body>
</html>
