<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="auth-minimal-page">
<main class="auth-minimal-shell">
    <section class="auth-minimal-card">
        <div class="auth-brand">CT</div>

        <p class="auth-kicker">Calendario tributario</p>
        <h1>Iniciar sesión</h1>
        <p class="auth-lead">
            Accede a tu cuenta para revisar vencimientos, obligaciones y recordatorios.
        </p>

        <div class="alert-line alert-error" th:if="${param.error}">
            Correo o contraseña incorrectos.
        </div>
        <div class="alert-line alert-success" th:if="${param.logout}">
            Sesión cerrada correctamente.
        </div>
        <div class="alert-line alert-success" th:if="${param.registrado}">
            Registro exitoso. Ahora puedes ingresar.
        </div>

        <form class="auth-form" th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label class="field-group">
                <span class="field-label">Correo</span>
                <input class="text-input" type="email" name="username" placeholder="usuario@correo.com" autocomplete="username" required />
            </label>

            <label class="field-group">
                <span class="field-label">Contraseña</span>
                <input class="text-input" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            </label>

            <button class="primary-action" type="submit">Entrar</button>
        </form>

        <p class="auth-footer">
            ¿No tienes cuenta?
            <a class="secondary-action" th:href="@{/registro}">Crear cuenta</a>
        </p>
    </section>
</main>
</body>
</html>
