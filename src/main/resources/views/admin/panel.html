<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de administracion | Cronos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="dashboard-page">
    <main class="dashboard-shell">
        <header class="topbar">
            <div class="topbar-left">
                <a th:href="@{/dashboard}" class="topbar-brand">CT</a>
                <nav class="topbar-nav">
                    <a th:href="@{/dashboard}" class="nav-link">Dashboard</a>
                    <a th:href="@{/clientes}" class="nav-link">Contribuyentes</a>
                    <a th:href="@{/empleados}" class="nav-link">Empleados</a>
                    <a th:href="@{/admin}" class="nav-link active">Admin</a>
                </nav>
            </div>
            <div class="topbar-right">
                <span class="pill pill-accent" th:text="|${totalUsuarios} usuarios|">0 usuarios</span>
                <span class="topbar-user" th:text="${usuario.name}">Admin</span>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="secondary-btn" type="submit">Cerrar sesion</button>
                </form>
            </div>
        </header>

        <section class="grid-4">
            <article class="info-card accent-border">
                <span class="card-label">Total</span>
                <strong class="card-value" th:text="${totalUsuarios}">0</strong>
            </article>
            <article class="info-card">
                <span class="card-label">Acceso</span>
                <strong class="card-value">ROLE_ADMIN</strong>
            </article>
            <article class="info-card">
                <span class="card-label">Seccion</span>
                <strong class="card-value">Protegida</strong>
            </article>
            <article class="info-card">
                <span class="card-label">Sistema</span>
                <strong class="card-value">Cronos</strong>
            </article>
        </section>

        <section class="panel-card">
            <div class="panel-header">
                <h3>Usuarios en Mongo Atlas <small th:text="|${totalUsuarios} registros|">0 registros</small></h3>
            </div>

            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${usuarios}">
                            <td th:text="${usuario.name}">Nombre</td>
                            <td th:text="${usuario.email}">Correo</td>
                            <td>
                                <span class="chip" th:text="${usuario.role != null ? usuario.role.name : 'ROLE_USER'}">ROLE_USER</span>
                            </td>
                            <td>
                                <span class="pill pill-success" th:if="${usuario.active}">Activo</span>
                                <span class="pill pill-danger" th:if="${!usuario.active}">Inactivo</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
